<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a140f"/>
      <stop offset="0.55" stop-color="#5a2018"/>
      <stop offset="1" stop-color="#2a1810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#e0901e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0901e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf7a"/>
      <stop offset="0.5" stop-color="#e0901e"/>
      <stop offset="1" stop-color="#b86c0c"/>
    </linearGradient>
    <radialGradient id="logo" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f3cf7a"/>
      <stop offset="0.55" stop-color="#e0901e"/>
      <stop offset="1" stop-color="#7a1d05"/>
    </radialGradient>
    <pattern id="batik" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#e0901e" opacity="0.18"/>
      <rect x="14" width="14" height="28" fill="#5a2018" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#batik)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Batik top & bottom bands -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#gold)"/>
  <rect x="0" y="620" width="1200" height="10" fill="url(#gold)"/>
  <rect x="0" y="14" width="1200" height="3" fill="#e0901e" opacity="0.4"/>
  <rect x="0" y="613" width="1200" height="3" fill="#e0901e" opacity="0.4"/>

  <!-- Left content -->
  <g transform="translate(70, 100)">
    <!-- Logo mark -->
    <circle cx="60" cy="60" r="58" fill="url(#logo)" stroke="#f3cf7a" stroke-width="2"/>
    <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="900" fill="#3a140f" text-anchor="middle">N</text>

    <!-- Eyebrow -->
    <text x="140" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#e0901e" letter-spacing="6">SHAH ALAM • SELANGOR</text>
    <text x="140" y="76" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#f3e6cc" opacity="0.85">RESIPI WARISAN SEJAK 1995</text>
    <text x="140" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#f3e6cc" opacity="0.85">HALAL • TRADISIONAL • SEGAR HARIAN</text>
  </g>

  <!-- Restaurant name -->
  <text x="70" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="900" fill="#fbf3e3">Warung Nasi Ambeng</text>
  <text x="70" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="900" font-style="italic" fill="url(#gold)">Hajah Marliah</text>

  <!-- Tagline -->
  <text x="72" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#f3e6cc" opacity="0.92">Rasa kampung yang sebenar — dimakan berkeluarga.</text>

  <!-- Rating block -->
  <g transform="translate(70, 490)">
    <rect x="0" y="0" width="430" height="78" rx="14" fill="#fbf3e3" opacity="0.08" stroke="#e0901e" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Stars -->
    <g transform="translate(20, 18)" fill="#e0901e">
      <path d="M12 2l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.99 6.12 21.06 7.24 14.52 2.48 9.88l6.58-.96z"/>
      <path d="M52 2l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L52 17.99 46.12 21.06 47.24 14.52 42.48 9.88l6.58-.96z"/>
      <path d="M92 2l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L92 17.99 86.12 21.06 87.24 14.52 82.48 9.88l6.58-.96z"/>
      <path d="M132 2l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L132 17.99 126.12 21.06 127.24 14.52 122.48 9.88l6.58-.96z"/>
      <path d="M172 2l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L172 17.99 166.12 21.06 167.24 14.52 162.48 9.88l6.58-.96z"/>
    </g>
    <text x="220" y="36" font-family="Georgia, serif" font-size="32" font-weight="900" fill="#f3cf7a">4.9 / 5</text>
    <text x="20" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#f3e6cc" opacity="0.85">4,900+ ULASAN GOOGLE • 100% HALAL</text>
  </g>

  <!-- Contact -->
  <g transform="translate(560, 510)">
    <circle cx="14" cy="14" r="14" fill="#25d366"/>
    <path d="M14 6c-4.4 0-8 3.6-8 8 0 1.4.4 2.7 1 3.9L6 22l4.2-1c1.1.6 2.4 1 3.8 1 4.4 0 8-3.6 8-8s-3.6-8-8-8zm0 2.4c3.1 0 5.6 2.5 5.6 5.6 0 1.2-.4 2.3-1 3.2l.6 1.9-2-.5c-.9.5-2 .8-3.2.8-3.1 0-5.6-2.5-5.6-5.6s2.5-5.4 5.6-5.4z" fill="#fff" transform="translate(0, -2)"/>
    <text x="38" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#fbf3e3">018-356 4161</text>
    <text x="38" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#f3e6cc" opacity="0.8">Kampung Jln Kebun, Shah Alam</text>
  </g>

  <!-- Right decorative plate -->
  <g transform="translate(940, 315)">
    <circle r="190" fill="none" stroke="#e0901e" stroke-width="1" opacity="0.25"/>
    <circle r="160" fill="none" stroke="#e0901e" stroke-width="1" opacity="0.4"/>
    <circle r="130" fill="#fbf3e3" opacity="0.06"/>
    <circle r="125" fill="none" stroke="#f3cf7a" stroke-width="2" opacity="0.5"/>
    <!-- Stylized rice mound -->
    <ellipse cx="0" cy="0" rx="95" ry="35" fill="#f3cf7a" opacity="0.18"/>
    <ellipse cx="0" cy="-15" rx="70" ry="55" fill="#f3cf7a" opacity="0.25"/>
    <ellipse cx="0" cy="-25" rx="42" ry="38" fill="#f3cf7a" opacity="0.35"/>
    <!-- Garnish dots -->
    <circle cx="-55" cy="30" r="6" fill="#5a2018" opacity="0.7"/>
    <circle cx="60" cy="25" r="7" fill="#e0901e"/>
    <circle cx="0" cy="55" r="5" fill="#5a2018" opacity="0.6"/>
    <circle cx="-30" cy="-50" r="4" fill="#5a2018" opacity="0.5"/>
    <circle cx="35" cy="-45" r="5" fill="#e0901e" opacity="0.8"/>
  </g>
</svg>
